<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>404 | Felix Phạm</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png"/>
  <link rel="shortcut icon" type="image/png" href="assets/images/favicon-256.png"/>
  <link rel="stylesheet" type="text/css" href="assets/css/style.css">
  <style>
    body {
      background-color: #000000;
      color: #ffeec8;
      font-family: 'Monumentgrotesk', sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .error-code {
      font-family: 'Editorialnew', serif;
      font-weight: 200;
      font-style: italic;
      font-size: 15vw;
      line-height: 1;
      margin: 0;
      color: #ffeec8;
    }
    .error-msg {
      font-family: 'MonumentgroteskMono', monospace;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #bdbab3;
      margin: 20px 0 40px;
    }
    .back-btn {
      display: inline-block;
      padding: 12px 28px;
      border: 1px solid rgba(255, 238, 200, 0.3);
      border-radius: 999px;
      color: #ffeec8;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }
    .back-btn:hover {
      background: #ffeec8;
      color: #000000;
    }
</style>
</head>
<body>
  <h1 class="error-code">404</h1>
  <div class="error-msg">Page Not Found</div>
  <a href="/" class="back-btn">Back to Work</a>
</body>
</html>
